<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POC Admin — Login</title><link rel="stylesheet" href="admin.css"></head><body><main class="login"><div class="login-card"><img src="assets/logo-poc.png"><small>POC ADMIN</small><h1>Selamat datang</h1><p>Masuk untuk mengelola produk dan usaha POC.</p><form onsubmit="login(event)"><label>Username<input id="user" autocomplete="username" required></label><label>Password<input id="pass" type="password" autocomplete="current-password" required></label><button>Masuk ke Dashboard</button><div id="err"></div></form><a href="index.html">← Kembali ke website pelanggan</a></div></main><script>
function login(e){e.preventDefault();if(user.value==='admin'&&pass.value==='poc2026'){sessionStorage.setItem('poc_admin','1');location.href='admin-dashboard.html'}else err.textContent='Username atau password salah.'}
</script></body></html>
